# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

# TODO:
# - update coveralls
# - get a badge for tests passing
# - download binary dependencies from conda
name: Tests
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest pytest-cov coveralls ruff
          pip install -r requirements.txt
          pip install '.[plot,data]'
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run default linting script
        run: |
          ./lint.sh
      - name: Cache Ensembl source archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/pyensembl/**/*.gz
          key: ${{ runner.os }}-pyensembl-source-grch38-87-grch37-75-grcm38-102-v1
      - name: Install Ensembl data
        run: |
          echo "Before installing Ensembl releases" && df -h
          bash .github/scripts/install_ensembl_data.sh
          echo "After installing Ensembl releases" && df -h

      - name: Run unit tests
        run: |
          ./test.sh
      - name: Publish coverage to Coveralls
        if: matrix.python-version == '3.11'
        uses: coverallsapp/github-action@v2.2.3

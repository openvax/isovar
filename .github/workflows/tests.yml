# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77"
          python -m pip install flake8 pytest pytest-cov coveralls ruff
          pip install -r requirements.txt
          pip install '.[plot,data]'
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Run default linting script
        run: |
          ./lint.sh
      - name: Require an unreleased version newer than the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git show FETCH_HEAD:isovar/__init__.py > "$RUNNER_TEMP/base_init.py"
          python -m pip install packaging
          python .github/scripts/check_release_version.py "$RUNNER_TEMP/base_init.py"
      - name: Cache Ensembl source archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/pyensembl/**/*.gz
          key: ${{ runner.os }}-pyensembl-source-grch38-87-grch37-75-grcm38-102-v1
      - name: Install Ensembl data
        run: |
          echo "Before installing Ensembl releases" && df -h
          bash .github/scripts/install_ensembl_data.sh
          echo "After installing Ensembl releases" && df -h

      # Isovar's Sid test reads come from osteosarc's openvax-v1 bundle
      # (about 28 MB), downloaded once and verified by digest.
      - name: Cache osteosarc test data
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/osteosarc
          # A new pin or export layout gets a new cache.
          key: ${{ runner.os }}-osteosarc-${{ hashFiles('requirements.txt', 'isovar/sid_data.py') }}
      - name: Run unit tests
        env:
          OSTEOSARC_CACHE: ${{ runner.temp }}/osteosarc
        run: |
          ./test.sh
      # The coveralls package comes from PyPI with the other test tools, so
      # publishing needs no separate reporter download (#358). A failed upload
      # fails the job.
      - name: Publish coverage to Coveralls
        if: matrix.python-version == '3.11'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: coveralls --service=github

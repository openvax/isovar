# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SAMtools for original BAM witness checks
        run: |
          sudo apt-get update
          sudo apt-get install --yes samtools
          samtools --version
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77"
          python -m pip install pytest pytest-cov coveralls ruff
          pip install -r requirements.txt
          pip install '.[data,test]'
          python -m pip check
          isovar --help >/dev/null
      - name: Run default linting script
        run: |
          ./lint.sh
      - name: Require an unreleased version newer than the base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          git show FETCH_HEAD:isovar/__init__.py > "$RUNNER_TEMP/base_init.py"
          python -m pip install packaging
          python .github/scripts/check_release_version.py "$RUNNER_TEMP/base_init.py"
      - name: Cache Ensembl source archives
        uses: actions/cache@v6
        with:
          path: ~/.cache/pyensembl/**/*.gz
          key: ${{ runner.os }}-pyensembl-source-grch38-87-95-grch37-75-grcm38-102-v3
      - name: Install Ensembl data
        run: |
          echo "Before installing Ensembl releases" && df -h
          bash .github/scripts/install_ensembl_data.sh
          echo "After installing Ensembl releases" && df -h

      # Isovar's Sid test reads come from osteosarc's shared openvax-v1 bundle
      # (about 28 MB), cached once under OSTEOSARC_CACHE and verified against
      # its pinned manifest SHA-256.
      - name: Cache osteosarc test data
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/osteosarc
          # A new pin or export layout gets a new cache.
          key: ${{ runner.os }}-osteosarc-${{ hashFiles('requirements.txt', 'isovar/sid_data.py') }}
      - name: Fetch and verify Sid test reads via osteosarc
        env:
          OSTEOSARC_CACHE: ${{ runner.temp }}/osteosarc
        working-directory: ${{ runner.temp }}
        run: |
          python -m isovar.sid_data check
      - name: Run unit tests
        env:
          OSTEOSARC_CACHE: ${{ runner.temp }}/osteosarc
        run: |
          ./test.sh
      # The coveralls package comes from PyPI with the other test tools, so
      # publishing needs no separate reporter download (#358). A failed upload
      # fails the job.
      - name: Publish coverage to Coveralls
        if: matrix.python-version == '3.11'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: coveralls --service=github

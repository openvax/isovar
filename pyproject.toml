[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "isovar"
requires-python = ">=3.11"
authors = [{name="Alex Rubinsteyn"}, {name="Arman Aksoy"}, {name="Julia Kodysh"}]
description = "Determine mutant protein sequences from RNA using assembly around variants"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
readme = "README.md"
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
version = {attr = "isovar.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["isovar", "isovar.*"]

[tool.setuptools.package-data]
# Isovar's Sid test reads: an osteosarc bundle (notes/sid-test-reads.md).
isovar = ["data/sid-reads/*.json", "data/sid-reads/sources/*", "data/references/*.json"]

[project.urls]
"Homepage" = "https://github.com/openvax/isovar"
"Bug Tracker" = "https://github.com/openvax/isovar/issues"

[project.optional-dependencies]
# Compatibility aliases: figures and reports are included in the base install.
plot = []
report = []
data = ["biopython>=1.80,<2"]  # Independent SAM/ORF and annotated-proteome checks.
uorf-build = ["openpyxl>=3.1,<4"]  # Optional source-data builder; never needed to query the catalogue.

[project.scripts]
isovar-proteome = "isovar.cli.isovar_proteome:run"
isovar-cohort = "isovar.cli.isovar_cohort:run"
isovar-viral = "isovar.cli.isovar_viral:run"
isovar-isoforms = "isovar.cli.isovar_isoforms:run"
isovar-uorf-evidence = "isovar.cli.isovar_uorf_evidence:run"
isovar-audit-bundle = "isovar.cli.isovar_audit_bundle:run"
isovar = "isovar.cli.commands:run"
isovar-calibrate-phasing = "isovar.cli.isovar_calibrate_phasing:run"
isovar-protein-sequences = "isovar.cli.isovar_protein_sequences:run"
isovar-protein-hypotheses = "isovar.cli.isovar_protein_hypotheses:run"
isovar-translations = "isovar.cli.isovar_translations:run"
isovar-reference-contexts = "isovar.cli.isovar_reference_contexts:run"
isovar-allele-reads = "isovar.cli.isovar_allele_reads:run"
isovar-allele-counts = "isovar.cli.isovar_allele_counts:run"
isovar-variant-reads = "isovar.cli.isovar_variant_reads:run"
isovar-variant-sequences = "isovar.cli.isovar_variant_sequences:run"
isovar-plot = "isovar.cli.isovar_plot:run"
isovar-evidence-report = "isovar.cli.isovar_evidence_report:run"
isovar-antigen-report = "isovar.cli.isovar_antigen_report:run"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E731"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test*/*" = ["F401"]

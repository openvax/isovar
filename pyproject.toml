[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "isovar"
requires-python = ">=3.11"
authors = [{name="Alex Rubinsteyn"}, {name="Arman Aksoy"}, {name="Julia Kodysh"}]
description = "Determine mutant protein sequences from RNA using assembly around variants"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
readme = "README.md"
dynamic = ["version", "dependencies"]

[tool.setuptools.dynamic]
version = {attr = "isovar.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["isovar", "isovar.*"]

[tool.setuptools.package-data]
isovar = ["data/references/*.json"]

[project.urls]
"Homepage" = "https://github.com/openvax/isovar"
"Bug Tracker" = "https://github.com/openvax/isovar/issues"

[project.optional-dependencies]
# Compatibility aliases: figures and reports are included in the base install.
plot = []
report = []
data = ["biopython>=1.80,<2"]  # Independent SAM/ORF and annotated-proteome checks.
test = ["pypdf>=5,<7"]  # PDF text inspection in tests.

[project.scripts]
isovar = "isovar.cli.commands:run"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E731"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"test*/*" = ["F401"]
